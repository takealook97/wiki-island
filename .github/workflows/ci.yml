name: ci

on:
  push:
    branches: [main, windows-support, svc-linux, 'win/**']
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [all, windows-latest, ubuntu-latest, macos-latest]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - id: matrix
        env:
          SELECTED_OS: ${{ inputs.os || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$SELECTED_OS" != all ]; then
            echo "os=[\"$SELECTED_OS\"]" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" != workflow_dispatch ] && [[ "$GIT_REF" == refs/heads/win/* ]]; then
            echo 'os=["windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Free runner disk space
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  # Licence compatibility with AGPL-3.0-only and the proof that the capture, search and MCP
  # library crates carry no network client. Neither check builds anything.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses
      - run: sh scripts/check-offline-tree.sh

  # A real systemd user manager: wi setup installs and starts the unit, doctor reports it and
  # uninstall removes it. Lingering starts the runner user's manager without a login session.
  linux-systemd:
    needs: plan
    if: contains(needs.plan.outputs.os, 'ubuntu-latest')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wiki-island --bin wi
      - name: Start the user manager
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 30); do
            test -S "/run/user/$uid/bus" && break
            sleep 1
          done
          test -S "/run/user/$uid/bus"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          # The manager reads units from the runner's own config folder.
          echo "XDG_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"
      - name: Probe the user manager
        shell: bash
        run: systemctl --user show-environment > /dev/null
      - name: Setup, doctor and uninstall against the real manager
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/wi-systemd"
          mkdir -p "$work/home" "$work/bin"
          # A copy outside target/ is a stable binary path for the unit.
          install -m 755 target/debug/wi "$work/bin/wi"
          export HOME="$work/home" WI_VAULT="$work/home/wiki-island" WI_CACHE_DIR="$work/cache"
          "$work/bin/wi" setup
          units=("$XDG_CONFIG_HOME"/systemd/user/wiki-island-*.service)
          test "${#units[@]}" -eq 1 && test -f "${units[0]}"
          unit=$(basename "${units[0]}")
          cat "${units[0]}"
          head -n 1 "${units[0]}" | grep -Ex '# Managed by wiki-island\. Vault [A-Za-z0-9_-]+\.'
          systemctl --user is-enabled "$unit"
          sleep 5
          test "$(systemctl --user is-active "$unit")" = active
          test "$(systemctl --user show -p NRestarts --value "$unit")" = 0
          systemctl --user status "$unit" --no-pager || true
          "$work/bin/wi" doctor | tee "$work/doctor.txt"
          grep -F "[ok] service: Background care is running." "$work/doctor.txt"
          "$work/bin/wi" uninstall
          test ! -e "${units[0]}"
          state=$(systemctl --user is-active "$unit" || true)
          echo "after uninstall: $state"
          test "$state" != active
          test "$state" != activating
          if systemctl --user is-enabled "$unit"; then exit 1; fi

  # Hosted Windows runners are administrators, so the no-elevation proof runs as a newly
  # created standard local user. Start-Process -Credential starts the proof script under that
  # user's own logon without any interactive prompt.
  windows-standard-user:
    needs: plan
    if: contains(needs.plan.outputs.os, 'windows-latest')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wiki-island --bin wi
      - name: Register, run, query and remove a logon task as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # net user asks for confirmation above 14 characters, so stay at 14.
          $password = "Wi!" + [guid]::NewGuid().ToString("N").Substring(0, 8) + "a9Z"
          Write-Output "::add-mask::$password"
          net user wiproof $password /add
          if ($LASTEXITCODE -ne 0) { throw "could not create the standard user" }
          $members = net localgroup Administrators | Out-String
          Write-Output $members
          if ($members -match "(?m)^wiproof\s*$") { throw "wiproof must not be an administrator" }
          $work = "C:\wiproof"
          New-Item -ItemType Directory -Force $work | Out-Null
          icacls $work /grant "wiproof:(OI)(CI)F" | Out-Null
          Copy-Item .github/scripts/windows-standard-user.ps1 $work
          # A program folder with a space and a vault with a space and an ampersand.
          New-Item -ItemType Directory -Force "$work\wi bin" | Out-Null
          Copy-Item target\debug\wi.exe "$work\wi bin\wi.exe"
          $arguments = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "$work\windows-standard-user.ps1",
            "-Work", $work, "-Wi", "`"$work\wi bin\wi.exe`"", "-Vault", "`"$work\notes & more`"", "-Standard")
          $credential = New-Object System.Management.Automation.PSCredential("wiproof", (ConvertTo-SecureString $password -AsPlainText -Force))
          $process = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $arguments `
            -Credential $credential -LoadUserProfile -WorkingDirectory $work -Wait -PassThru `
            -RedirectStandardOutput "$work\out.txt" -RedirectStandardError "$work\err.txt"
          Get-Content "$work\out.txt"
          Get-Content "$work\err.txt"
          Write-Output "proof exit code: $($process.ExitCode)"
          exit $process.ExitCode
      - name: Setup, doctor and uninstall with a running watcher as the runner user
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "wi task"
          New-Item -ItemType Directory -Force "$work\bin" | Out-Null
          Copy-Item target\debug\wi.exe "$work\bin\wi.exe"
          # App settings go to a scratch profile; the task still runs as the runner user.
          $env:USERPROFILE = Join-Path $work "profile"
          $env:APPDATA = Join-Path $work "roaming"
          $env:LOCALAPPDATA = Join-Path $work "local"
          & ./.github/scripts/windows-standard-user.ps1 -Work $work -Wi "$work\bin\wi.exe" `
            -Vault "$work\notes & more" -ExpectRunning
          exit $LASTEXITCODE
