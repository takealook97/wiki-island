# License policy for the dependency tree, checked in CI with `cargo deny check licenses`.
# The workspace is AGPL-3.0-only, so every dependency license must be compatible with it.
# Compatibility below is an inference from the license texts, not legal advice.
# Only licenses the tree needs are listed; add a license only after judging its compatibility.
# Only the licenses check is configured; there are no advisories, bans or sources checks.

[graph]
# Judge every optional feature and every target, including Windows-only crates.
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    # Our own license, for the workspace crates.
    "AGPL-3.0-only",
    # Permissive licenses with no copyleft condition.
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # MPL-2.0 section 3.3 names the AGPL-3.0 as a secondary license (option-ext).
    "MPL-2.0",
    # A permissive data license with no copyleft condition (webpki-roots).
    "CDLA-Permissive-2.0",
]
