[package]
name = "wi-history"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gix = { version = "0.90", default-features = false, features = ["sha1", "index"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml_edit = "0.23"

[features]
# Crash and race hooks driven by `WI_FAULT` (tests only).
fault-injection = []

[[bin]]
name = "wi-history-testproc"
path = "src/bin/wi-history-testproc.rs"
required-features = ["fault-injection"]

[dev-dependencies]
wi-history = { path = ".", features = ["fault-injection"] }
tempfile = "3"
serde_json = "1"
