[package]
name = "wi-note"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = "2"
yaml-rust2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml_edit = "0.23"
pulldown-cmark = "0.13"
regex = "1"
unicode-normalization = "0.1"
unidecode = "0.3"
mime_guess = "2"

[dev-dependencies]
proptest = "1"
